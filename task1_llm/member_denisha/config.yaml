seed: 20260929
data_path: ../data/TinyStories-train.jsonl
train_samples: 100000
validation_samples: 10000
sequence_length: 128
# Non-overlapping chunks avoid duplicating almost every character as a new sample.
stride: 128
batch_size: 256
embedding_dim: 256
num_heads: 4
num_layers: 4
feedforward_dim: 1024
dropout: 0.1
learning_rate: 0.0003
weight_decay: 0.01
warmup_steps: 1000
epochs: 10
gradient_clip_norm: 1.0
num_workers: 2
log_interval_batches: 250
save_every_epoch: true
amp: true
precision: bfloat16
pin_memory: true
resume_from: null
device: auto
