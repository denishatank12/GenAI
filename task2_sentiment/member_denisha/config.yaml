seed: 20260929
data_path: ../data/yelp_polarity.csv
max_vocab_size: 30000
max_length: 256
batch_size: 128
epochs: 10
learning_rate: 0.001
weight_decay: 0.0001
validation_fraction: 0.1
device: auto
remove_stopwords: true
stemming: true
models:
  baseline:
    type: bow_mlp
    embedding_dim: 128
    hidden_dim: 128
    dropout: 0.2
  experimental_cnn:
    type: text_cnn
    embedding_dim: 128
    channels: 128
    kernel_sizes: [3, 4, 5]
    dropout: 0.3
  experimental_gru:
    type: gru
    embedding_dim: 128
    hidden_dim: 128
    layers: 2
    dropout: 0.3
